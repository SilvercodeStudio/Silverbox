# Config file for Dosbox-ECE r4230
[sdl]
fullscreen=false
output=openglnb
[dosbox]
machine=svga_s3
memsize=63
[render]
aspect=true
scaler=normal2x
[cpu]
core=auto
cputype=auto
cycles=auto
[midi]
mididevice=default
fluid.soundfont=.\mt32\SoundCanvas.sf2
mt32.romdir=.\mt32
[speaker]
tandy=on
[ipx]
ipx=true
[autoexec]
@mount c .\eXoDOS\SuperTet
mount a .\eXoDOS\SuperTet\floppy -t floppy
imgmount d ".\eXoDOS\SuperTet\cd\disc 1.cue" ".\eXoDOS\SuperTet\cd\disc 2.cue" -t cdrom -usecd 0 -ioctl
c:
cls
@call run
exit

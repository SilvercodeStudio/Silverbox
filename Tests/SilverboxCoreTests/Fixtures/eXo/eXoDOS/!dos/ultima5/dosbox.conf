# Config file for Dosbox-ECE r4230
[sdl]
fullscreen=false
fulldouble=false
fullresolution=0x0
windowresolution=960x720
output=openglnb
mapperfile=mapper.map
[dosbox]
machine=svga_s3
memsize=16
[render]
aspect=true
scaler=normal2x
[cpu]
core=simple
cputype=386_slow
cycles=5000
cycleup=500
cycledown=500
[pci]
[mixer]
[midi]
mididevice=mt32
fluid.soundfont=.\mt32\SoundCanvas.sf2
mt32.romdir=.\mt32
[sblaster]
[gus]
[speaker]
disney=true
[joystick]
[serial]
[dos]
keyboardlayout=auto
[ipx]
[autoexec]
@mount c .\eXoDOS\
c:
cls
cd ultima5
@call transfer
exit
